<!DOCTYPE html>
<html lang="en">

<head>
	<meta name='robots' content='noindex'>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<meta name="theme-color" content="#000000">
	<meta name="authoring-tool" content="Adobe_Animate_CC">
	<title>bloxorz</title>
	<link rel="manifest" href="manifest.json">
	<link rel="icon" href="icon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="icon.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
	<link href="default.css" rel="stylesheet" type="text/css">
	<link href="shell.css" rel="stylesheet" type="text/css">
	<link href="extra.css" rel="stylesheet" type="text/css">
	<script src="version.js"></script>
	<script src="extra.bundle.js"></script>
	<script src="feedback.js"></script>
	<script src="levels.js"></script>
	<script src="timer.js"></script>
	<script src="code.createjs.com/createjs-2015.11.26.min.js"></script>
	<script src="bloxorz.js"></script>
	<script>
		var canvas, stage, exportRoot, anim_container, dom_overlay_container, fnStartAnimation;
		var VALID_THEMES = ["original", "gray", "holiday"];

		function normalizeTheme(value) {
			if (VALID_THEMES.indexOf(value) !== -1) {
				return value;
			}

			return "original";
		}

		function getThemeFromUrl() {
			var params = new URLSearchParams(window.location.search);
			return normalizeTheme(params.get("img"));
		}

		function getStoredTheme() {
			var saved = window.localStorage && window.localStorage.getItem("theme");
			return normalizeTheme(saved);
		}

		function saveTheme(theme) {
			window.localStorage && window.localStorage.setItem("theme", normalizeTheme(theme));
		}

		function buildThemeUrl(theme) {
			var url = new URL(window.location.href);
			url.searchParams.set("img", normalizeTheme(theme));
			return url.toString();
		}

		(function syncThemeOnStartup() {
			var params = new URLSearchParams(window.location.search);
			var hasThemeInUrl = params.has("img") && params.get("img") !== "";
			var themeFromUrl = getThemeFromUrl();
			var storedTheme = getStoredTheme();

			if (!hasThemeInUrl && storedTheme !== "original") {
				window.location.replace(buildThemeUrl(storedTheme));
				return;
			}

			saveTheme(themeFromUrl);
		})();

		function init() {
			var imageSelect = document.getElementById("image_select");
			if (imageSelect) {
				imageSelect.value = getThemeFromUrl();
			}

			canvas = document.getElementById("canvas");
			anim_container = document.getElementById("animation_container");
			dom_overlay_container = document.getElementById("dom_overlay_container");
			var versionEl = document.getElementById("build-version");
			if (versionEl) {
				versionEl.textContent = "v" + (window.GAME_VERSION || "2.5.0");
			}
			var comp = AdobeAn.getComposition("FE31B685947E79408F0C8768D6EC8517");
			var lib = comp.getLibrary();
			var loader = new createjs.LoadQueue(false);
			loader.installPlugin(createjs.Sound);
			loader.addEventListener("fileload", function (evt) {
				handleFileLoad(evt, comp)
			});
			loader.addEventListener("complete", function (evt) {
				handleComplete(evt, comp)
			});
			var lib = comp.getLibrary();
			loader.loadManifest(lib.properties.manifest);
		}

		function handleFileLoad(evt, comp) {
			var images = comp.getImages();
			if (evt && (evt.item.type == "image")) {
				images[evt.item.id] = evt.result;
			}
		}

		function handleComplete(evt, comp) {
			//This function is always called, irrespective of the content. You can use the variable "stage" after it is created in token create_stage.
			var lib = comp.getLibrary();
			var ss = comp.getSpriteSheet();
			var queue = evt.target;
			var ssMetadata = lib.ssMetadata;
			for (i = 0; i < ssMetadata.length; i++) {
				ss[ssMetadata[i].name] = new createjs.SpriteSheet({
					"images": [queue.getResult(ssMetadata[i].name)],
					"frames": ssMetadata[i].frames
				})
			}

			var preloaderDiv = document.getElementById("_preload_div_");
			preloaderDiv.style.display = 'none';
			dom_overlay_container.style.display = canvas.style.display = 'block';
			exportRoot = new lib.bloxorzhtml();
			stage = new lib.Stage(canvas);
			var isTouchDevice = !!("ontouchstart" in window || navigator.maxTouchPoints);
			// Mouseover hit-tests are expensive; keep off until extra shell opts in for menus.
			stage.enableMouseOver(0);
			window.__bloxSetMouseOver = function (hz) {
				stage.enableMouseOver(isTouchDevice ? 0 : hz);
			};
			//Registers the "tick" event listener.
			fnStartAnimation = function () {
				stage.addChild(exportRoot);
				// Authored at 36fps — RAF-synced keeps timing smooth without speeding roll clips.
				if (createjs.Ticker.RAF_SYNCHED) {
					createjs.Ticker.timingMode = createjs.Ticker.RAF_SYNCHED;
				}
				createjs.Ticker.setFPS(lib.properties.fps);
				createjs.Ticker.addEventListener("tick", stage);
			}
			//Code to support hidpi screens and responsive scaling.
			function makeResponsive() {
				window.addEventListener('resize', resizeCanvas);
				resizeCanvas();

				function resizeCanvas() {
					var w = lib.properties.width, h = lib.properties.height;
					var iw = anim_container.offsetWidth;
					var ih = anim_container.offsetHeight;
					// Cap DPR — full retina canvases were a major FPS sink.
					var pRatio = Math.min(1.5, window.devicePixelRatio || 1),
						xRatio = iw / w,
						yRatio = ih / h,
						sRatio = Math.min(xRatio, yRatio);

					canvas.width = Math.round(w * pRatio * sRatio);
					canvas.height = Math.round(h * pRatio * sRatio);
					var wpx = w * sRatio + 'px';
					var hpx = h * sRatio + 'px';

					canvas.style.width = wpx;
					dom_overlay_container.style.width = wpx;
					canvas.style.height = hpx;
					dom_overlay_container.style.height = hpx;
					canvas.style.imageRendering = "pixelated";
					canvas.style.imageRendering = "crisp-edges";
					stage.scaleX = pRatio * sRatio;
					stage.scaleY = pRatio * sRatio;
					stage.tickOnUpdate = false;
					stage.update();
					stage.tickOnUpdate = true;
					var ctx = canvas.getContext("2d");
					if (ctx) {
						ctx.imageSmoothingEnabled = false;
					}
				}
			}
			makeResponsive();
			AdobeAn.compositionLoaded(lib.properties.id);
			fnStartAnimation();
			if (typeof startBloxorzShell === "function") {
				startBloxorzShell();
			}
		}

		function playSound(id, loop) {
			return createjs.Sound.play(id, createjs.Sound.INTERRUPT_EARLY, 0, 0, loop);
		}
	</script>
	<script type="text/javascript">
		setTimeout(function () {
			if (document.getElementsByTagName("canvas").length) {
				document.getElementsByTagName("body")[0].classList.add("no-select")
			}
		}, 2000);
	</script>
	<script type="text/javascript">
		function setUserAgent(window, userAgent) {
			// Works on Firefox, Chrome, Opera and IE9+
			if (navigator.__defineGetter__) {
				navigator.__defineGetter__("userAgent", function () {
					return userAgent;
				});
			} else if (Object.defineProperty) {
				Object.defineProperty(navigator, "userAgent", {
					get: function () {
						return userAgent;
					}
				});
			}
			// Works on Safari
			if (window.navigator.userAgent !== userAgent) {
				var userAgentProp = {
					get: function () {
						return userAgent;
					}
				};
				try {
					Object.defineProperty(window.navigator, "userAgent", userAgentProp);
				} catch (e) {
					window.navigator = Object.create(navigator, {
						userAgent: userAgentProp
					});
				}
			}
		}
		if (window.navigator.userAgent.indexOf("Safari") >= 0 && "ontouchstart" in window && window.navigator.userAgent.indexOf("iPhone") == -1) {
			//var userAgent = window.navigator.userAgent.replace("Macintosh", "iPad");
			var userAgent = "Mozilla/5.0 (iPad; CPU OS 13_1_2 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/13.0.1 Mobile/15E148 Safari/604.1";
			setUserAgent(window, userAgent);
		}
	</script>
</head>

<body onload="init();">
	<div id="app-shell">
	<div id="screen-split">
		<div id="side_panel">
			<select id="image_select" onchange="change_image()">
				<option value="">Select Theme</option>
				<option value="original">Original</option>
				<option value="gray">Gray</option>
				<option value="holiday">Holiday</option>
			</select>
			<div id="table_container">
				<table id="timeTable">
					<thead>
						<tr>
							<th>Stage</th>
							<th>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Time</th>
						</tr>
					</thead>
					<tbody id="timeRows">
						<tr id='stage1'>
							<td>1</td>
							<td>-</td>
						</tr>
						<tr id='stage2'>
							<td>2</td>
							<td>-</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
		<div id="animation_container">
			<canvas id="canvas"></canvas>
			<div id="dom_overlay_container">
				<div id="build-version"></div>
				<input id="hud-input" type="text" maxlength="10" autocomplete="off" spellcheck="false" hidden>
				<div id="hud-modal">
					<div class="hud-modal-card">
						<p id="hud-modal-title">Enter code</p>
						<input id="hud-modal-input" type="text" maxlength="80" autocomplete="off" spellcheck="false">
						<div class="hud-modal-row">
							<button type="button" id="hud-modal-ok">OK</button>
							<button type="button" id="hud-modal-cancel">Cancel</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	</div>
	<div id="touch-pad" hidden>
		<div class="tp-cluster tp-dpad" aria-label="Move">
			<button type="button" class="tp-btn tp-up" data-dir="up" aria-label="Up">▲</button>
			<button type="button" class="tp-btn tp-left" data-dir="left" aria-label="Left">◀</button>
			<button type="button" class="tp-btn tp-right" data-dir="right" aria-label="Right">▶</button>
			<button type="button" class="tp-btn tp-down" data-dir="down" aria-label="Down">▼</button>
		</div>
		<div class="tp-cluster tp-actions">
			<button type="button" class="tp-btn tp-swap" data-act="swap">OK</button>
			<button type="button" class="tp-btn tp-rotate" data-act="rotate">ROTATE</button>
			<button type="button" class="tp-btn tp-menu" data-act="pause">PAUSE</button>
		</div>
	</div>
	<div id="install-hint" hidden>
		<p>Install Bloxorz as an app. The on-screen pad overlays the stage so the playfield stays full size.</p>
		<div class="install-row">
			<button type="button" id="install-now">Install app</button>
			<button type="button" id="install-dismiss">Not now</button>
		</div>
		<p id="install-how" hidden></p>
	</div>
	<div id="landscape-hint" hidden>
		<p>Rotate the device if the pad covers a tight landscape stage.</p>
	</div>
	<div id="_preload_div_">
		<img id="preload_img" src="images/preloader.gif" />
	</div>
	<script>
		var canNotifyParent = window.parent && window.parent !== window;

		function fnSendMsg() {
			if (!canNotifyParent) return;
			window.parent.postMessage('keypress-from-game', '*');
		}

		document.body.addEventListener('click', fnSendMsg);
		document.addEventListener('keypress', fnSendMsg);
		document.addEventListener('keydown', fnSendMsg);
		document.addEventListener('keyup', fnSendMsg);

		function change_image() {
			let e = document.getElementById("image_select");
			var selectedTheme = normalizeTheme(e && e.value);
			saveTheme(selectedTheme);
			window.location.href = buildThemeUrl(selectedTheme);
		}
	</script>
</body>

</html>
